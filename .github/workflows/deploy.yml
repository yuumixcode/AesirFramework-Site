name: Deploy Zensical to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "zensical==0.1.1"  # 锁定版本，避免 0.x 期间上游破坏性变更导致部署失败
      # 0.1.1 的硬性前提:zensical.toml 里 edit_uri 必须置空("")，
      # 否则它会把「仓库地址 + edit_uri + 页面源路径」拼成绝对 URL 做 IRI 校验，
      # 而 Scripting API 页的源文件名含 C# 泛型占位(如 ObservableList{T}.md)，花括号非法 → 构建 panic。
      - run: zensical build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4