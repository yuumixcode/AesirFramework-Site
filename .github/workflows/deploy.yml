name: Deploy Redirect Shell
# 文档站已于 2026-11-23 并入框架主仓（https://yuumixcode.github.io/AesirFramework/）。
# 本仓不再构建站点，只发布全路径跳转壳：redirect/ 由 tools/make-redirects.py
# 从最后一次站点构建产物 site/ 生成（meta refresh + canonical 指向新站对应页）。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: redirect }
      - id: deploy
        uses: actions/deploy-pages@v4